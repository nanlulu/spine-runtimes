<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chuck - Extracted Skin Viewer</title>
<style>
body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #ebeef4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
canvas {
    border: 1px solid #ccc;
}
.controls {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
}
select, button {
    padding: 8px 20px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
}
button:hover, select:hover {
    background: #f0f0f0;
}
label {
    font-size: 14px;
}
</style>
<script src="../../../../dist/iife/spine-webgl.js"></script>
</head>
<body>

<canvas id="canvas" width="640" height="480"></canvas>
<div class="controls">
    <label for="anim-select">Animation:</label>
    <select id="anim-select"></select>
    <label><input type="checkbox" id="loop-check" checked> Loop</label>
</div>

<script>
(function () {
    var canvas = document.getElementById("canvas");
    var gl, renderer, assetManager, skeleton, state;
    var timeKeeper = new spine.TimeKeeper();
    var bgColor = new spine.Color(235 / 255, 239 / 255, 244 / 255, 1);
    var offset = new spine.Vector2();
    var bounds = new spine.Vector2();

    var context = new spine.ManagedWebGLRenderingContext(canvas, { alpha: false });
    gl = context.gl;
    renderer = new spine.SceneRenderer(canvas, gl);
    assetManager = new spine.AssetManager(gl, "", new spine.Downloader());
    assetManager.loadTextureAtlas("chuck.atlas");
    assetManager.loadJson("chuck.json");

    var loaded = false;

    function loadingComplete() {
        var atlasLoader = new spine.AtlasAttachmentLoader(assetManager.get("chuck.atlas"));
        var skeletonJson = new spine.SkeletonJson(atlasLoader);
        var skeletonData = skeletonJson.readSkeletonData(assetManager.get("chuck.json"));
        skeleton = new spine.Skeleton(skeletonData);
        skeleton.setSkinByName("Chuck");
        var stateData = new spine.AnimationStateData(skeleton.data);
        stateData.defaultMix = 0.2;
        stateData.setMix("roll", "run", 0);
        stateData.setMix("jump", "run2", 0);
        state = new spine.AnimationState(stateData);
        state.setAnimation(0, "idle", true);
        state.apply(skeleton);
        skeleton.updateWorldTransform(spine.Physics.update);
        skeleton.getBounds(offset, bounds, []);

        // Populate dropdown with all animations
        var select = document.getElementById("anim-select");
        var animations = skeletonData.animations;
        for (var i = 0; i < animations.length; i++) {
            var opt = document.createElement("option");
            opt.value = animations[i].name;
            opt.textContent = animations[i].name;
            if (animations[i].name === "idle") opt.selected = true;
            select.appendChild(opt);
        }

        select.addEventListener("change", function () {
            var loop = document.getElementById("loop-check").checked;
            state.setAnimation(0, select.value, loop);
        });

        document.getElementById("loop-check").addEventListener("change", function () {
            var current = state.getCurrent(0);
            if (current) current.loop = this.checked;
        });
    }

    var loadingScreen = new spine.LoadingScreen(renderer);

    function loop() {
        requestAnimationFrame(loop);
        timeKeeper.update();

        var complete = assetManager.isLoadingComplete();
        if (complete) {
            if (!loaded) {
                loaded = true;
                loadingComplete();
            }

            renderer.camera.position.x = offset.x + bounds.x * 1.5 - 125;
            renderer.camera.position.y = offset.y + bounds.y / 2;
            renderer.camera.viewportWidth = bounds.x * 3;
            renderer.camera.viewportHeight = bounds.y * 1.2;
            renderer.resize(spine.ResizeMode.Fit);

            gl.clearColor(bgColor.r, bgColor.g, bgColor.b, bgColor.a);
            gl.clear(gl.COLOR_BUFFER_BIT);

            state.update(timeKeeper.delta);
            state.apply(skeleton);
            skeleton.updateWorldTransform(spine.Physics.update);

            renderer.begin();
            renderer.drawSkeleton(skeleton, true);
            renderer.end();
        }
        loadingScreen.draw(complete);
    }

    requestAnimationFrame(loop);
})();
</script>

</body>
</html>
